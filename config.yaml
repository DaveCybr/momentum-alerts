# ── Momentum Alert Engine — konfigurasi v1 ──
# Semua threshold = knob. Jangan hardcode di kode.

timezone_display: "Asia/Jakarta"      # WIB (UTC+7) — semua waktu user-facing pakai ini
source_tz: "Etc/GMT-0"                # tz timestamp bridge (server broker). TODO: konfirmasi —
                                      # daily candle ter-stamp 07:00, verifikasi sebelum pakai filter sesi

instruments:                          # multi-pair (Valetax .vx). Data owner: edge di XAU(66%)+BTC(61%)
  - "XAUUSD.vx"
  - "BTCUSD.vx"
direction: both                       # long_only | both. 'both' = SELL aktif tapi EKSPERIMEN
                                      # (edge short belum terbukti — alert ditandai + buat data)

# ── Data: MT5 (Valetax) via mt5linux RPyC. MT5 kasih semua TF native, tanpa resample. ──
data:
  mt5:
    host_env: MT5_HOST                # container→"mt5" (service name) ; test di host VPS→"localhost"
    port_env: MT5_PORT
    host: localhost
    port: 8001
  counts:                             # jumlah candle per TF (native dari MT5)
    M5:  400                           # SMC pre-screen (challenger) — trigger TF
    M15: 400                           # SMC pre-screen — liquidity map
    M30: 400
    H1:  400
    H4:  400
    D1:  400
  entry_tfs:  [M30, H1]
  regime_tfs: [H4, D1]

# ── Strategi aktif (v1 = trend_pullback, terbukti & deterministik). SMC = challenger Phase 3. ──
strategy:
  active: smc_prescreen               # FLIP 20/07 atas permintaan owner (execution ON). SMC belum divalidasi live — experimental.
  params:
    ema_fast: 20
    ema_slow: 50
    ema_trend: 200                    # regime filter di H4
    atr_period: 14
    rsi_period: 14
    sl_atr_mult: 1.5
    tp_r: [1.5, 3.0, 5.0]             # target LEBAR — data: runner >12h = 74% profit XAU
                                      # NB: trailing hidup di execution.trail (bukan knob mati di sini)

# ── SMC pre-screen (challenger, deterministik). Params terpisah; belum dipakai sampai di-promote. ──
# Fire-rate tervalidasi ~0.4% di 900 eval (10 hari M5 XAU) — pre-screen yg benar: jarang & terarah.
smc:
  swing_k: 2                          # sensitivitas fractal pivot
  atr_period: 14
  disp_body_ratio: 0.65               # displacement: body/range minimum
  disp_atr_mult: 1.5                  # displacement: range >= x*ATR
  rr_min: 2.5                         # gerbang keras RR
  rr_aplus: 3.0                       # >= ini → HIGH_CONF
  rr_cap: 5.0                         # clamp RR ekstrem (SL M5 ketat + target H1 lebar → RR absurd spt 11.73)
  struct_lookback: 40                 # window swing struktural
  trigger_lookback: 12                # window M5 utk sweep/displacement/MSS
  sweep_lookback: 20                  # window M15 pool likuiditas
  sessions_utc: [[7, 16], [12, 21]]   # London 07-16, NY 12-21 UTC
  server_utc_offset: 2                # timestamp candle broker = UTC+2 (VERIFIED 20/07). Cek ulang kalau DST → +3
  require_session: true

# ── Alert engine: bias-ke-diam (mulai super ketat) ──
alert:
  max_per_day: 5
  cooldown_hours: 2                   # per arah, kecuali regime flip
  min_tier: HIGH_CONF                 # v1 cuma A+ (longgarkan nanti kalau kepercayaan terbangun)
  skip_hours_wib: []                  # DIKOSONGKAN 20/07: filter subuh nahan 2 SELL HIGH_CONF (id1,2). Prinsip: jangan over-filter sesi (Asia 67% WR). Skip lama basis sampel kecil.
  soft_filter_days_wib: [Wed, Thu]    # hari lemah historis → naikkan ambang. TODO: hitung ulang di WIB
  soft_min_score: 5                   # di hari lemah, skor minimal dinaikkan

scheduler:
  eval_on_close: M30                  # tick tiap M30 close (:00/:30 WIB)
  minutes: 30
  offset_sec: 5                       # jeda setelah close biar candle sudah final di bridge
  monitor_sec: 60                     # monitor auto-outcome tiap 60 detik
  deadman_min: 90                     # kalau scheduler diam > ini → alarm "buta" ke Telegram

delivery:
  telegram:
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  send_chart: false                   # v1 teks dulu (hemat latensi)

# ── Eksekusi (v1: one-tap manual, DEMO). Short eksperimen dikunci dari eksekusi. ──
execution:
  enabled: false                      # DIMATIKAN selama build SMC-faithful (#8-17). Nyalakan lagi
                                      # begitu entry-limit/manajemen/filter beres — cegah trade menyimpang playbook.
  allow_short: true                   # DEMO: short boleh dieksekusi (ngumpulin data). Set false utk live
  risk_percent: 1.0                   # target risk/trade (di-floor lot minimum broker)
  max_positions: 1                    # v1 = 1 posisi PER instrumen. layering/multi = v2
  target_tp: 1                        # SMC §15: TP1 (target likuiditas pertama), set-and-forget
  trailing: false                     # §15: TANPA trailing stop. Posisi exit di TP atau SL saja.
  trail:
    tf: M30
    atr_period: 14
    atr_mult: 3.0
    activate_r: 1.0
    count: 200
    partial_on_lock: false            # §15: TANPA partial close. Satu entry, satu TP, satu SL.
  deviation_pct: 0.1                  # toleransi slippage = 0.1% harga (auto-scale gold vs BTC)
  magic: 20260719

journal:
  db_path: "var/signals.db"           # /app/var (volume) — bukan data/ (itu package python)

ai:
  enabled: false                      # MASTER SWITCH. false = grader shadow TAK jalan sama sekali.
                                      # true = grade log-only (TETAP tak nge-gate; lihat task #3/#4)
  log_only: true                      # penegasan: AI TAK PERNAH memutuskan kirim sampai #4 lolos
  shadow_min_gates: 5                 # AI grade kandidat pre-screen SMC yg lolos >= ini (dari 7)
  grader:                             # diteruskan ke ai.grader.call_grader (override DEFAULTS)
    base_url: "http://localhost:20128/v1"
    provider: ac-prod                 # punya kuota (cc/ kena rate limit)
    model_base: claude-sonnet
    model_suffix: "-5"                # router bisa remap; OK utk grading
    temperature: 0
    rr_min: 2.5
    rr_aplus: 3.0
