# ── Momentum Alert Engine — konfigurasi canonical SMC ──
# Semua threshold = knob. Jangan hardcode di kode.
# Canonical spec: strategy/xauusd-smc-trading-system.md

timezone_display: "Asia/Jakarta"      # WIB (UTC+7)
source_tz: "UTC"                      # candle broker dikonversi ke UTC dengan server_utc_offset

instruments:
  - "XAUUSD.vx"
  - "BTCUSD.vx"
direction: both                       # SELL = DEMO eksperimen (allow_short: true)

data:
  mt5:
    host_env: MT5_HOST
    port_env: MT5_PORT
    host: localhost
    port: 8001
  counts:
    M5:  400
    M15: 400
    M30: 400
    H1:  400
    H4:  400
    D1:  400

# ── Strategi canonical SMC (stateful, deterministik) ──
strategy:
  active: smc_canonical

smc_canonical:
  swing_k: 2
  atr_period: 14
  disp_body_ratio: 0.65
  disp_atr_mult: 1.5
  rr_min: 2.5
  rr_aplus: 3.0
  struct_lookback: 40
  trigger_lookback: 12
  sweep_lookback: 20
  poi_lookback: 60
  sl_spread_mult: 1.0
  expiry_candles: 3
  sessions_utc: [[7, 0, 10, 0], [12, 0, 15, 30]]   # London 07:00-10:00, NY 12:00-15:30 UTC
  server_utc_offset: 2                                # broker UTC+2; verifikasi DST -> +3
  require_session: true

alert:
  max_per_day: 5
  cooldown_hours: 2
  min_tier: HIGH_CONF
  skip_hours_wib: []
  soft_filter_days_wib: [Wed, Thu]
  soft_min_score: 5

scheduler:
  eval_on_close: M5                  # SMC trigger TF = M5
  minutes: 5
  offset_sec: 5
  monitor_sec: 60
  deadman_min: 90

delivery:
  telegram:
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  send_chart: false

# ── Eksekusi: pending-limit, set-and-forget, DEMO only ──
execution:
  enabled: false                     # flip true setelah activation gate
  demo_verified: false               # set true setelah verifikasi manual
  allow_short: true                  # DEMO data collection; set false sebelum LIVE
  risk_percent: 1.0
  max_positions: 1
  pending_expiry_min: 15             # ~3 candle M5
  trailing: false                    # SMC = set-and-forget
  target_tp: 1
  daily_stop:
    max_losses: 2
    max_trades: 3
    target_r: 2.5
  deviation_pct: 0.1
  magic: 20260726

news:
  enabled: false                     # DEFERRED block 1; alert tagged news_filter_applied=0
  file: "var/news.txt"               # future: manual high-impact USD times, satu ISO ts per baris

journal:
  db_path: "var/signals.db"

ai:
  enabled: false
  log_only: true
  shadow_min_gates: 5
  grader:
    base_url: "http://localhost:20128/v1"
    provider: ac-prod
    model_base: claude-sonnet
    model_suffix: "-5"
    temperature: 0
    rr_min: 2.5
    rr_aplus: 3.0
